<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twoje korzenie|Strona w budowie</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f5f1e6; 
      color: #4b3b2a; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #fffaf3; 
      padding: 40px 60px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(100, 80, 50, 0.3);
      text-align: center;
      max-width: 500px;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
      color: #6b4f34; 
    }

    p {
      font-size: 1.1em;
      margin-bottom: 20px;
    }

    ul {
      list-style-type: circle;
      text-align: left;
      display: inline-block;
      color: #3f2f1e;
      margin-bottom: 25px;
    }

    li {
      margin: 5px 0;
    }

    a.button {
      display: inline-block;
      background-color: #8b6b4f; 
      color: white;
      padding: 10px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    a.button:hover {
      background-color: #6b4f34;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png.png" alt="Logo Twoje Korzenie" class="logo" width="50%" height="50%">
    <h1>Strona w budowie</h1>
    <p>Zapraszamy wkrótce!</p>
    <hr>
    <p><strong>Jesteś zainteresowany:</strong></p>
    <ul>
      <li>kompleksowymi lub częściowymi badaniami geneaologicznymi</li>
      <li>tłumaczeniem aktów</li>
    </ul> <br>
    <a href="mailto:twojekorzenie.kontakt@gmail.com" class="button">Napisz do nas</a>
  </div>
</body>
</html>
